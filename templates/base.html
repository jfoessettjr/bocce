<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bocce League Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >

  <style>
    body {
      background-color: #f5f5f5;
    }
    .navbar-brand {
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .league-badge {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('standings') }}">
        🧮 Bocce League
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav" aria-controls="navbarNav"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav ms-auto">
  <li class="nav-item">
    <a class="nav-link {% if request.endpoint == 'standings' %}active{% endif %}"
       href="{{ url_for('standings') }}">
      Standings
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link {% if request.endpoint == 'schedule' %}active{% endif %}"
       href="{{ url_for('schedule') }}">
      Schedule
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link {% if request.endpoint == 'add_match' %}active{% endif %}"
       href="{{ url_for('add_match') }}">
      Add Match
    </a>
  </li>
</ul>

      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="container mb-5">
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap JS (for navbar toggle, etc.) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
